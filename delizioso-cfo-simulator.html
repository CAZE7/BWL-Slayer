<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delizioso AG – Der CFO-Simulator · Investition &amp; Finanzierung 1</title>
<style>
:root {
  --bg: #070c16;
  --bg2: #0c1422;
  --card: #121c2e;
  --card2: #16223a;
  --line: #22304a;
  --txt: #e8eef8;
  --muted: #8fa1bd;
  --mint: #34d399;
  --sky: #38bdf8;
  --amber: #fbbf24;
  --violet: #a78bfa;
  --pink: #f472b6;
  --orange: #fb923c;
  --red: #f87171;
  --cyan: #22d3ee;
  --green: #4ade80;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(56, 189, 248, 0.13), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(52, 211, 153, 0.1), transparent 55%),
    var(--bg);
  color: var(--txt);
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 18px 64px; }

/* ---------- Header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(14px);
  background: rgba(7, 12, 22, 0.82);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1180px; margin: 0 auto; padding: 10px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; cursor: pointer; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, #34d399, #38bdf8); color: #05131f; font-size: 18px; font-weight: 900;
}
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.metrics { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.metric { min-width: 118px; }
.metric .m-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.metric .m-bar { height: 5px; border-radius: 99px; background: #1b2942; overflow: hidden; margin-top: 3px; }
.metric .m-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px;
  background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.chip.mint { color: var(--mint); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
.chip.amber { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
.chip.sky { color: var(--sky); border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.1); }

/* ---------- Typo / Layout ---------- */
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.03em; margin: 22px 0 6px; }
h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.card {
  background: linear-gradient(180deg, var(--card), var(--bg2));
  border: 1px solid var(--line); border-radius: 16px; padding: 18px;
}
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.card-head .icon { font-size: 24px; line-height: 1; }

/* ---------- Buttons ---------- */
button { font-family: inherit; font-size: 14px; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: var(--card2); color: var(--txt);
  padding: 9px 16px; border-radius: 11px; font-weight: 600; transition: 0.15s;
}
.btn:hover { background: #1d2c47; border-color: #2e4160; }
.btn.primary { background: linear-gradient(135deg, #34d399, #22d3ee); color: #04121c; border: none; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }

/* ---------- World grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.world-card {
  position: relative; overflow: hidden; border-radius: 16px; padding: 16px;
  background: linear-gradient(180deg, var(--card), var(--bg2));
  border: 1px solid var(--line); cursor: pointer; transition: 0.18s;
}
.world-card:hover { transform: translateY(-3px); border-color: #35507a; box-shadow: 0 14px 30px -18px rgba(56, 189, 248, 0.5); }
.world-card .wc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.world-card .wc-no {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; background: #1a2740; border: 1px solid var(--line);
}
.world-card h3 { margin: 0; font-size: 15.5px; }
.world-card .tag { font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 32px; }
.world-card .dots { display: flex; gap: 5px; margin-top: 8px; }
.dot { height: 5px; flex: 1; border-radius: 99px; background: #1e2b44; }
.dot.on { background: var(--mint); }
.side-tag { position: absolute; top: 14px; right: 14px; font-size: 10px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
.side-INV { color: var(--sky); background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); }
.side-FIN { color: var(--pink); background: rgba(244, 114, 182, 0.12); border: 1px solid rgba(244, 114, 182, 0.3); }
.locked { opacity: 0.55; filter: saturate(0.6); }

/* ---------- Stage list ---------- */
.stage-row {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--card); cursor: pointer; transition: 0.15s;
}
.stage-row + .stage-row { margin-top: 10px; }
.stage-row:hover { border-color: #35507a; background: var(--card2); }
.stage-row.done { border-color: rgba(52, 211, 153, 0.4); }
.stage-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: #1a2740; border: 1px solid var(--line); flex: none; }
.stage-row.done .stage-num { background: rgba(52, 211, 153, 0.15); border-color: var(--mint); color: var(--mint); }

/* ---------- Game elements ---------- */
.brief { display: grid; gap: 10px; }
.brief-item { border-left: 3px solid var(--sky); padding: 2px 0 2px 12px; }
.brief-item b { color: var(--txt); }
.brief-item p { margin: 3px 0 0; font-size: 13.5px; color: #c3d1e6; }

.prompt { font-size: 15px; margin-bottom: 10px; }
.given {
  font-family: "SFMono-Regular", ui-monospace, Menlo, monospace; font-size: 13px;
  background: #0a1220; border: 1px dashed #2b3d5c; border-radius: 10px; padding: 9px 12px;
  color: #9fe6c8; margin-bottom: 12px; overflow-x: auto;
}
.field-row { display: grid; grid-template-columns: 1fr 160px; gap: 10px; align-items: center; margin-bottom: 9px; }
.field-row label { font-size: 13.5px; color: #cfdcee; }
input[type="text"], input[type="number"], select {
  width: 100%; background: #0a1220; border: 1px solid #2b3d5c; color: var(--txt);
  border-radius: 9px; padding: 8px 11px; font-size: 14px; font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
input.ok { border-color: var(--mint); background: rgba(52, 211, 153, 0.08); }
input.bad { border-color: var(--red); background: rgba(248, 113, 113, 0.08); }
.unit { color: var(--muted); font-size: 12.5px; margin-left: 6px; }

.opt-list { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--card2); color: var(--txt); font-size: 14px; transition: 0.13s;
}
.opt:hover { border-color: #3b5680; background: #1b2a45; }
.opt.correct { border-color: var(--mint); background: rgba(52, 211, 153, 0.14); }
.opt.wrong { border-color: var(--red); background: rgba(248, 113, 113, 0.12); }
.opt:disabled { cursor: default; }

.feedback { margin-top: 12px; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; border: 1px solid; }
.feedback.good { background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.4); }
.feedback.warn { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.4); }
.feedback.bad { background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.4); }
.feedback b { display: block; margin-bottom: 3px; }
.feedback .coach { display: flex; gap: 8px; margin-top: 6px; }
.feedback .coach .avatar { font-size: 17px; }

.trap-badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 99px; background: rgba(251, 191, 36, 0.14); color: var(--amber); border: 1px solid rgba(251, 191, 36, 0.35); margin-left: 8px; vertical-align: middle; }

/* swipe / sort */
.swipe-card {
  border-radius: 16px; padding: 20px; text-align: center; font-size: 16.5px; font-weight: 600;
  background: linear-gradient(135deg, #14233a, #0d1728); border: 1px solid #2b3d5c;
  min-height: 104px; display: grid; place-items: center; animation: pop 0.22s ease;
}
@keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.sort-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px; margin-top: 12px; }
.sort-btn { padding: 13px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--txt); font-weight: 600; }
.sort-btn:hover { border-color: #3b5680; background: #1b2a45; }

/* order game */
.order-pool { display: grid; gap: 8px; }
.order-item { padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--card2); text-align: left; color: var(--txt); }
.order-item:hover { border-color: #3b5680; }
.order-slot { padding: 9px 14px; border-radius: 11px; border: 1px dashed #2b3d5c; background: #0a1220; font-size: 13.5px; margin-bottom: 7px; }
.order-slot.filled { border-style: solid; border-color: #35507a; background: var(--card2); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
td:first-child, th:first-child { text-align: left; }
tr.hl td { background: rgba(56, 189, 248, 0.07); }
.table-wrap { overflow-x: auto; }

/* sliders */
.slider-row { margin: 14px 0; }
.slider-row .s-label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.slider-row .s-value { color: var(--txt); font-weight: 700; font-variant-numeric: tabular-nums; }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 6px; border-radius: 99px;
  background: linear-gradient(90deg, #38bdf8, #34d399); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: #eaf6ff; border: 3px solid #0a1220; box-shadow: 0 0 0 2px #38bdf8; cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: #eaf6ff; border: 3px solid #0a1220; cursor: pointer;
}

/* metric tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: #0d1728; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.tile .t-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tile .t-value { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* progress bar (stage) */
.pbar { height: 6px; border-radius: 99px; background: #1b2942; overflow: hidden; }
.pbar > i { display: block; height: 100%; background: linear-gradient(90deg, #34d399, #38bdf8); transition: width 0.35s; }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: #16243aee; border: 1px solid #35507a; color: var(--txt);
  padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  opacity: 0; transition: 0.25s; pointer-events: none; z-index: 90; backdrop-filter: blur(8px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(4, 8, 15, 0.78); backdrop-filter: blur(4px); z-index: 60; display: grid; place-items: center; padding: 18px; }
.modal { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; width: min(900px, 100%); max-height: 88vh; overflow: auto; padding: 20px; }

/* exam */
.exam-timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; letter-spacing: 0.02em; }
.exam-timer.low { color: var(--red); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }

hr.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.kbd { font-family: ui-monospace, monospace; font-size: 11.5px; background: #1a2740; border: 1px solid #2e4160; border-radius: 5px; padding: 1px 6px; }
svg text { font-family: inherit; font-size: 10.5px; fill: #8fa1bd; }
@media (max-width: 720px) {
  .field-row { grid-template-columns: 1fr; }
  .metrics { width: 100%; }
  .metric { flex: 1 1 40%; }
  h1 { font-size: 24px; }
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============================================================
   Delizioso AG – CFO-Simulator
   src/engine.js  –  Finanzmathematische Engine (Investition & Finanzierung 1, UHH)
   Reine, deterministische Funktionen. 1:1 portierbar nach TypeScript.
   ============================================================ */
(function () {
  'use strict';

  const FIN = {};

  /* ---------- Helfer ---------- */
  FIN.round = function (x, d) {
    d = d === undefined ? 2 : d;
    const f = Math.pow(10, d);
    return Math.round((x + Number.EPSILON * Math.sign(x)) * f) / f;
  };
  // Kaufmännisch auf 2 Nachkommastellen (halb auf), für Anzeige
  FIN.eur = function (x, d) {
    d = d === undefined ? 2 : d;
    return x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  FIN.pct = function (x, d) {
    d = d === undefined ? 2 : d;
    return x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' %';
  };

  /* ============================================================
     1. STATISCHE INVESTITIONSRECHNUNG (Kapitel 2)
     ============================================================ */
  FIN.analyzeStaticMachine = function (m) {
    const depreciation = (m.acquisitionCost - m.residualValue) / m.usefulLife;
    const averageBoundCapital = (m.acquisitionCost + m.residualValue) / 2;
    const imputedInterest = averageBoundCapital * m.interestRate;
    const totalFixedCosts = m.fixedOperatingCosts + depreciation + imputedInterest;
    const p = m.pricePerUnit || 0;
    const db = p - m.variableCostPerUnit;

    const totalCostsAtX = (x) => m.variableCostPerUnit * x + totalFixedCosts;
    const profitAtX = (x) => db * x - totalFixedCosts;
    const returnOnCapitalAtX = (x) => (profitAtX(x) / averageBoundCapital) * 100;
    const breakEvenQuantity = db > 0 ? totalFixedCosts / db : null;
    const annualCashflowAtX = (x) => profitAtX(x) + depreciation + imputedInterest;
    const paybackPeriodAtX = (x) => {
      const cf = annualCashflowAtX(x);
      return cf > 0 ? m.acquisitionCost / cf : Infinity;
    };
    // Deckungsbeitragsquote & Sicherheitskoeffizient (bei gegebener Menge)
    const marginRatio = (x) => (p > 0 ? db / p : null);
    const safetyCoefficient = (x) => {
      const be = breakEvenQuantity;
      return be && x ? (x - be) / x : null;
    };

    return {
      depreciation,
      averageBoundCapital,
      imputedInterest,
      totalFixedCosts,
      contributionMarginPerUnit: db,
      totalCostsAtX,
      profitAtX,
      returnOnCapitalAtX,
      breakEvenQuantity,
      annualCashflowAtX,
      paybackPeriodAtX,
      marginRatio,
      safetyCoefficient,
    };
  };

  /** Kritische Menge im Kosten- (COST) oder Gewinnvergleich (PROFIT) */
  FIN.criticalQuantity = function (m1, m2, mode) {
    mode = mode || 'COST';
    const r1 = FIN.analyzeStaticMachine(m1);
    const r2 = FIN.analyzeStaticMachine(m2);
    let denom, num;
    if (mode === 'COST') {
      denom = m1.variableCostPerUnit - m2.variableCostPerUnit;
      num = r2.totalFixedCosts - r1.totalFixedCosts;
    } else {
      denom =
        (m2.pricePerUnit || 0) - m2.variableCostPerUnit - ((m1.pricePerUnit || 0) - m1.variableCostPerUnit);
      num = r2.totalFixedCosts - r1.totalFixedCosts;
    }
    if (denom === 0) return null;
    return num / denom;
  };

  /** Kumulationsmethode: exakte Amortisationsdauer bei ungleichen Rückflüssen */
  FIN.cumulativePayback = function (a0, cashflows) {
    let cumulative = 0;
    const target = Math.abs(a0);
    for (let t = 0; t < cashflows.length; t++) {
      const next = cumulative + cashflows[t];
      if (next >= target) {
        const rest = target - cumulative;
        return { years: t + rest / cashflows[t], fullYears: t, rest, inflow: cashflows[t], cumulativeBefore: cumulative };
      }
      cumulative = next;
    }
    return null;
  };

  /* ============================================================
     2. DYNAMISCHE INVESTITIONSRECHNUNG (Kapitel 3)
     ============================================================ */
  FIN.df = (i, t) => Math.pow(1 + i, -t); // Werkzeug I: Abzinsungsfaktor
  FIN.rbf = (i, n) => (i === 0 ? n : (1 - Math.pow(1 + i, -n)) / i); // Werkzeug II
  FIN.anf = (i, n) => (i === 0 ? 1 / n : i / (1 - Math.pow(1 + i, -n))); // Werkzeug III

  /** Kapitalwert klassisch: KW = -|A0| + Σ CF_t·(1+i)^-t   (CF in t=1..n) */
  FIN.npv = (a0, flows, i) => -Math.abs(a0) + FIN.pvFlows(flows, i);
  /** Barwert einer Zahlungsreihe ab t=1 */
  FIN.pvFlows = (flows, i, start) => {
    start = start || 1;
    let s = 0;
    for (let k = 0; k < flows.length; k++) s += flows[k] * FIN.df(i, start + k);
    return s;
  };
  /** Kapitalwert mit vorzeichenbehafteten Zahlungen inkl. t=0 (für Kreditvergabe/-aufnahme) */
  FIN.npvSigned = (flows, i) => {
    let s = 0;
    for (let k = 0; k < flows.length; k++) s += flows[k] * FIN.df(i, k);
    return s;
  };
  FIN.annuityFromNPV = (npv, i, n) => npv * FIN.anf(i, n);
  FIN.profitabilityIndex = (npv, a0) => npv / Math.abs(a0);
  /** alternativ: PI über Barwert (Kriterium > 1) */
  FIN.profitabilityIndexPV = (a0, flows, i) => FIN.pvFlows(flows, i) / Math.abs(a0);
  FIN.dynamicPayback = (a0, flows, i) => FIN.cumulativePayback(a0, flows.map((cf, k) => cf * FIN.df(i, k + 1)));

  /** Sekanten-/Strahlensatz-Iteration */
  FIN.secantIRRStep = function (a0, flows, i1, i2) {
    const kw1 = FIN.npv(a0, flows, i1);
    const kw2 = FIN.npv(a0, flows, i2);
    const iStar = i1 + kw1 * ((i2 - i1) / (kw1 - kw2));
    const kwStar = FIN.npv(a0, flows, iStar);
    return { iStar, kw1, kw2, kwStar };
  };

  /** Exakter IRR per Bisektion (nur für Vorzeichenwechsel-Reihen) */
  FIN.irr = function (a0, flows) {
    const f = (i) => FIN.npv(a0, flows, i);
    let lo = -0.9999, hi = 10;
    if (f(lo) * f(hi) > 0) return null;
    for (let k = 0; k < 200; k++) {
      const mid = (lo + hi) / 2;
      if (f(lo) * f(mid) <= 0) hi = mid;
      else lo = mid;
    }
    return (lo + hi) / 2;
  };

  /** Sonderfall 1: eine Aus- und eine Einzahlung → i = (CF_t/|A0|)^(1/t) - 1 */
  FIN.irrSinglePayment = (a0, cf, t) => Math.pow(cf / Math.abs(a0), 1 / t) - 1;
  /** Sonderfall 2: Rente → Rbf = |A0|/CF, Bracketing + lineare Interpolation */
  FIN.irrAnnuityInterval = function (a0, cf, n) {
    const target = Math.abs(a0) / cf;
    let prev = null;
    for (let i = 0.0; i <= 1.0; i += 0.0001) {
      const v = FIN.rbf(i, n);
      if (v <= target) {
        if (!prev) return { rbf: target, lower: null, upper: null, iApprox: i };
        // Strahlensatz auf KW(i) = Rbf(i,n) - Zielwert (nicht auf Rbf selbst!)
        const kw1 = prev.v - target;
        const kw2 = v - target;
        const iStar = prev.i + kw1 * ((i - prev.i) / (kw1 - kw2));
        return { rbf: target, lower: prev, upper: { i: i, v: v }, iApprox: iStar };
      }
      prev = { i: i, v: v };
    }
    return null;
  };
  /** Sonderfall 3: ewige Rente → i = CF/|A0| */
  FIN.irrPerpetuity = (a0, cf) => cf / Math.abs(a0);

  /* ============================================================
     3. ANLEIHEN, ZINSSTRUKTUR & DURATION (Kapitel 4)
     ============================================================ */
  /** Barwert Kuponanleihe; y = Zahl (flache Struktur) oder Vektor (Spot Rates) */
  FIN.bondPV = function (faceValue, couponRate, maturity, y) {
    const coupon = faceValue * couponRate;
    let pv = 0;
    for (let t = 1; t <= maturity; t++) {
      const cf = t === maturity ? coupon + faceValue : coupon;
      const r = Array.isArray(y) ? y[t - 1] : y;
      pv += cf / Math.pow(1 + r, t);
    }
    return pv;
  };
  /** Zerobond-Rendite (Kassazins) ytm_0,T = (FV/PV)^(1/T) - 1 */
  FIN.zeroYield = (faceValue, price, maturity) => Math.pow(faceValue / price, 1 / maturity) - 1;

  /** Macauley- & Modified Duration inkl. Kursänderung */
  FIN.duration = function (faceValue, couponRate, maturity, y) {
    const coupon = faceValue * couponRate;
    let pvSum = 0, weighted = 0;
    const legs = [];
    for (let t = 1; t <= maturity; t++) {
      const cf = t === maturity ? coupon + faceValue : coupon;
      const pvCf = cf / Math.pow(1 + y, t);
      pvSum += pvCf;
      weighted += t * pvCf;
      legs.push({ t, cf, pvCf, weight: 0 });
    }
    legs.forEach((l) => (l.weight = l.pvCf / pvSum));
    const macauleyDuration = weighted / pvSum;
    const modifiedDuration = macauleyDuration / (1 + y);
    return {
      presentValue: pvSum,
      legs,
      macauleyDuration,
      modifiedDuration,
      priceChangeForDeltaY: function (deltaY) {
        const relative = -modifiedDuration * deltaY;
        return { relative, absolute: relative * pvSum };
      },
    };
  };
  /** Portfolioduration = Σ w_i · D_i */
  FIN.portfolioDuration = (weights, durations) => weights.reduce((s, w, k) => s + w * durations[k], 0);

  /* ============================================================
     4. FINANZIERUNG: LOHMANN-RUCHTI, BEZUGSRECHT, SKONTO, LEASING, LEVERAGE
     ============================================================ */
  /** Lohmann-Ruchti-Simulator (Kohortenmodell, Folie 65) */
  FIN.lohmannRuchti = function (initialMachines, costPerMachine, usefulLife, years) {
    initialMachines = initialMachines || 10;
    costPerMachine = costPerMachine || 5000;
    usefulLife = usefulLife || 5;
    years = years || 7;
    const cohorts = [initialMachines];
    const rows = [];
    let carried = 0;
    for (let y = 1; y <= years; y++) {
      const active = cohorts.reduce((a, b) => a + b, 0);
      const afa = active * (costPerMachine / usefulLife);
      const available = afa + carried;
      const bought = Math.floor(available / costPerMachine + 1e-9);
      const invested = bought * costPerMachine;
      const rest = available - invested;
      const retireIdx = y - usefulLife;
      const retired = retireIdx >= 0 ? cohorts[retireIdx] || 0 : 0;
      rows.push({
        year: y,
        activeMachines: active,
        depreciation: afa,
        available,
        bought,
        invested,
        retired,
        rest,
        availableBefore: available,
      });
      if (retireIdx >= 0) cohorts[retireIdx] = 0;
      cohorts.push(bought);
      carried = rest;
    }
    return rows;
  };

  /** Bezugsrecht & Kapitalerhöhung */
  FIN.subscriptionRight = function (p) {
    const ratio = p.oldShares / p.newShares; // a/n
    let disadvantage = 0;
    if (p.dividendOld != null && p.monthsEntitledNew != null) {
      disadvantage = p.dividendOld * (1 - p.monthsEntitledNew / 12);
    }
    const br = (p.oldSharePrice - (p.issuePriceNew + disadvantage)) / (ratio + 1);
    const mixedPrice =
      (p.oldShares * p.oldSharePrice + p.newShares * p.issuePriceNew) / (p.oldShares + p.newShares);
    const nominal = p.nominalValue == null ? 1 : p.nominalValue;
    const shareCapitalIncrease = p.newShares * nominal;
    const agio = p.newShares * (p.issuePriceNew - nominal);
    return {
      ratio,
      disadvantage,
      subscriptionRightValue: br,
      mixedPrice,
      shareCapitalIncrease,
      agio,
      totalInflow: shareCapitalIncrease + agio,
      wealthCheck: { withExercise: p.oldSharePrice - br, withSale: p.oldSharePrice - br },
    };
  };

  /** Lieferantenkredit: Jahreszins nach 360-Tage-Überschlagsformel */
  FIN.supplierCreditRate = (skontoPct, targetDays, skontoDays) =>
    (skontoPct / (targetDays - skontoDays)) * 360;

  /** Leasing-Bilanzierung nach Folie 175 */
  FIN.leasingOwner = function (input) {
    if (input.isSpecialLeasing) return { owner: 'LEASING_NEHMER', reason: 'Spezial-Leasing → immer Leasingnehmer' };
    const ratio = input.basicLeaseTermMonths / input.usefulLifeMonths;
    if (ratio < 0.4) return { owner: 'LEASING_NEHMER', reason: 'GMZ < 40 % der BGND → Zurechnung Leasingnehmer' };
    if (ratio > 0.9) return { owner: 'LEASING_NEHMER', reason: 'GMZ > 90 % der BGND → Zurechnung Leasingnehmer' };
    if (input.optionType === 'NONE')
      return { owner: 'LEASING_GEBER', reason: '40–90 % und keine Option → Leasinggeber' };
    if (input.optionType === 'PURCHASE')
      return input.optionPriceBelowBookValue
        ? { owner: 'LEASING_NEHMER', reason: 'Kaufoption unter Restbuchwert → Leasingnehmer' }
        : { owner: 'LEASING_GEBER', reason: 'Kaufoption ≥ Restbuchwert → Leasinggeber' };
    return input.extensionRentBelowDepreciation
      ? { owner: 'LEASING_NEHMER', reason: 'Anschlussmiete < lin. Wertverzehr → Leasingnehmer' }
      : { owner: 'LEASING_GEBER', reason: 'Anschlussmiete ≥ lin. Wertverzehr → Leasinggeber' };
  };

  /** Leverage-Effekt: r_e = r_g + FK/EK · (r_g − r_f) */
  FIN.leverage = function (equity, debt, rgPct, rfPct) {
    const ratio = debt / equity;
    const roePct = rgPct + ratio * (rgPct - rfPct);
    const totalCapital = equity + debt;
    const ebit = totalCapital * (rgPct / 100);
    const interest = debt * (rfPct / 100);
    return {
      leverageRatio: ratio,
      roePct,
      ebit,
      interest,
      netProfit: ebit - interest,
      positive: rgPct > rfPct,
      roeDirect: (ebit - interest) / equity * 100,
    };
  };

  /** Tilgungspläne (Folie 148) */
  FIN.amortizationPlan = function (principal, rate, years, type) {
    const rows = [];
    let rest = principal;
    if (type === 'ANNUITY') {
      const ann = principal * FIN.anf(rate, years);
      for (let t = 1; t <= years; t++) {
        const interest = rest * rate;
        const redemption = ann - interest;
        rest -= redemption;
        rows.push({ t, restStart: rest + redemption, interest, redemption, rate: ann, restEnd: rest });
      }
      return { rows, annualPayment: ann, total: ann * years };
    }
    const linear = principal / years;
    for (let t = 1; t <= years; t++) {
      const interest = rest * rate;
      if (type === 'REDEMPTION') {
        rest -= linear;
        rows.push({ t, restStart: rest + linear, interest, redemption: linear, rate: interest + linear, restEnd: rest });
      } else {
        // FEST / Fälligkeitsdarlehen
        const redemption = t === years ? principal : 0;
        rest -= redemption;
        rows.push({ t, restStart: rest + redemption, interest, redemption, rate: interest + redemption, restEnd: rest });
      }
    }
    const total = rows.reduce((s, r) => s + r.rate, 0);
    return { rows, total };
  };

  /** Kapitalbedarf Umlaufvermögen: Kapitalbindungsdauer × Tageskosten */
  FIN.workingCapitalNeed = function (phases, payableDays, costPerDay) {
    const days = phases.reduce((s, p) => s + p.days, 0) - payableDays;
    return { days, need: days * costPerDay };
  };

  /* ============================================================
     5. AKTIEN & AKTIENBEWERTUNG (Kapitel 5 – Erweiterungs-Slot)
     ============================================================ */

  /** Ergebnis je Aktie: (Jahresüberschuss − Vorzugsdividende) / Anzahl Stammaktien */
  FIN.eps = function (netIncome, preferredDividendTotal, commonShares) {
    return (netIncome - (preferredDividendTotal || 0)) / commonShares;
  };
  /** Kurs-Gewinn-Verhältnis */
  FIN.kgv = (price, eps) => (eps === 0 ? null : price / eps);
  /** Dividendenrendite */
  FIN.dividendYield = (dividend, price) => (price === 0 ? null : dividend / price);
  /** Gesamtrendite einer Aktie: (D1 + P1 − P0)/P0 */
  FIN.equityTotalReturn = (p0, d1, p1) => (d1 + p1 - p0) / p0;
  /** CAPM: r = r_f + β · (r_m − r_f) */
  FIN.capm = (rf, beta, rm) => rf + beta * (rm - rf);
  /** Gordon-Growth: P0 = D1/(r − g),  gültig für r > g */
  FIN.gordon = function (d1, r, g) {
    if (r <= g) return null;
    return d1 / (r - g);
  };
  /** Implizite Wachstumsrate bei gegebenem Kurs: g = r − D1/P0 */
  FIN.impliedGrowth = (d1, r, p0) => r - d1 / p0;
  /** Nachhaltige Wachstumsrate: g = Thesaurierungsquote · Eigenkapitalrendite */
  FIN.sustainableGrowth = (retentionRatio, roe) => retentionRatio * roe;
  /** Barwert expliziter Dividenden + Verkaufserlös in t=n */
  FIN.pvDividendStream = function (dividends, r, salePrice, saleAt) {
    let pv = 0;
    dividends.forEach((d, k) => (pv += d * FIN.df(r, k + 1)));
    if (salePrice && saleAt) pv += salePrice * FIN.df(r, saleAt);
    return pv;
  };
  /**
   * Zweiphasiges Dividendendiskontierungsmodell:
   * Wachstum g1 für n Jahre, danach ewiges Wachstum g2.
   */
  FIN.twoStageDDM = function (d1, g1, n, g2, r) {
    if (r <= g2) return null;
    const flows = [];
    let d = d1;
    for (let t = 1; t <= n; t++) {
      flows.push({ t: t, dividend: d });
      d = d * (1 + g1);
    }
    const dNext = flows[n - 1].dividend * (1 + g2); // Dividende in t = n+1 (Wachstum g2!)
    const terminal = dNext / (r - g2);
    let pv = 0;
    flows.forEach((f) => (pv += f.dividend / Math.pow(1 + r, f.t)));
    pv += terminal / Math.pow(1 + r, n);
    return { flows: flows, terminalValue: terminal, presentValue: pv, pvExplicit: pv - terminal / Math.pow(1 + r, n) };
  };
  /** Bewertung über ein konstantes KGV (Comparables-Ansatz) */
  FIN.valuationByMultiple = (eps, multiple) => eps * multiple;

  if (typeof window !== 'undefined') window.FIN = FIN;
  if (typeof module !== 'undefined' && module.exports) module.exports = FIN;
})();

  function parseNums(s) {
    if (s == null) return [];
    const raw = String(s).trim().replace(/[€%\s]/g, '');
    if (!raw) return [];
    const cands = [];
    if (raw.includes(',')) {
      cands.push(parseFloat(raw.replace(/\./g, '').replace(',', '.'))); // deutsches Format

    } else {
      cands.push(parseFloat(raw));
      cands.push(parseFloat(raw.replace(/\./g, ''))); // Punkte als Tausender
    }
    return cands.filter((x) => !isNaN(x));
  }

    root.innerHTML = `
      <div class="row" style="margin-bottom:6px">
        <button class="btn sm ghost" data-nav="world:${id}">← ${w.title}</button>
        <span class="chip" style="color:${w.color};border-color:${w.color}55">Welt ${w.no}</span>
        <span class="chip">Stufe ${stageNo} von 3</span>
      </div>
      <h1 style="margin-top:10px">${stageNo === 1 ? '🧠 ' + w.concept.title : stageNo === 2 ? '🧮 ' + w.lab.title : '♻️ ' + w.trainer.title}</h1>
      <p class="muted small" style="margin-bottom:16px">${stageNo === 1 ? w.concept.intro : stageNo === 2 ? w.lab.intro : w.trainer.intro}</p>
      <div id="game"></div>`;
    const g = document.getElementById('game');
    const finish = (ratio) => {
      const pts = Math.max(0, Math.min(10, Math.round(10 * ratio)));
      APP.award(id, stageNo - 1, pts);
      APP.stagePoints[stageNo - 1] = pts;
      g.innerHTML = `
        <div class="card center" style="padding:34px">
          <div style="font-size:44px">${ratio >= 0.99 ? '🏆' : ratio > 0 ? '✅' : '📘'}</div>
          <h2>Stufe ${stageNo} abgeschlossen</h2>
          <p class="muted">${pts} von 10 möglichen Punkten in dieser Stufe.</p>
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="btn" data-nav="stage:${id}:${stageNo}">Nochmal spielen</button>
            ${stageNo < 3 ? `<button class="btn primary" data-nav="stage:${id}:${stageNo + 1}">Weiter zu Stufe ${stageNo + 1} →</button>` : `<button class="btn primary" data-nav="world:${id}">Zurück zur Welt</button>`}
          </div>
        </div>`;
      const bar = document.querySelector('.topbar');
      if (bar && window.buildTopbar) bar.outerHTML = window.buildTopbar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    if (stageNo === 1) runConcept(w, g, finish);
    else if (stageNo === 2) runLab(w, g, finish);
    else runTrainer(w, g, finish);
  };

  /* ============================================================
     STUFE 1 – KONZEPTSPIELE
     ============================================================ */
  function runConcept(world, mount, done) {
    const items = world.concept.items;
    let idx = 0;
    let correct = 0;
    let total = 0;

    function countUnits(it) {
      if (it.kind === 'quiz') return it.questions.length;
      if (it.kind === 'order') return 1;
      return (it.rounds || []).reduce((a, r) => a + r.cards.length, 0);
    }
    const totalAll = items.reduce((a, it) => a + countUnits(it), 0);

    function step() {
      if (idx >= items.length) return done(totalAll ? correct / totalAll : 1);
      const it = items[idx];
      const n = countUnits(it);
      const head = `
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <span class="chip">${it.title}</span>
          <span class="tiny muted">${correct} richtig · ${total} bewertet</span>
        </div>
        <div class="pbar" style="margin-bottom:16px"><i style="width:${Math.round(((idx) / items.length) * 100)}%"></i></div>`;
      mount.innerHTML = `<div class="card">${head}<div id="itembody"></div></div>`;
      const body = document.getElementById('itembody');
      const cb = (good) => {
        correct += good;
        total += n;
        idx++;
        step();
      };
      if (it.kind === 'sort') sortGame(it, body, cb);
      else if (it.kind === 'order') orderGame(it, body, cb);
      else quizGame(it, body, cb);
    }
    step();
  }

  function sortGame(item, body, cb) {
    let roundIdx = 0, cards = [], ci = 0, mistakes = 0;
    function startRound() {
      if (roundIdx >= item.rounds.length) return cb(mistakes === 0 ? 1 : 0.5);
      cards = shuffle(item.rounds[roundIdx].cards.slice());
      ci = 0;
      drawRound();
    }
    function drawRound() {
      const round = item.rounds[roundIdx];
      if (ci >= cards.length) {
        roundIdx++;
        return setTimeout(startRound, 600);
      }
      const c = cards[ci];
      window.__sortCard = c; // für automatisierte Tests
      body.innerHTML = `
        <div class="tiny muted" style="margin-bottom:8px">${round.title} · Karte ${ci + 1}/${cards.length}</div>
        <div class="swipe-card">${c.text}</div>
        <div class="sort-btns">
          ${round.categories.map((cat) => `<button class="sort-btn" data-cat="${cat.id}">${cat.label}</button>`).join('')}
        </div>
        <div id="fb"></div>`;
      body.querySelectorAll('.sort-btn').forEach((btn) => {
        btn.onclick = () => {
          const ok = btn.getAttribute('data-cat') === c.cat;
          if (!ok) mistakes++;
          const label = round.categories.find((x) => x.id === c.cat).label;
          body.querySelectorAll('.sort-btn').forEach((b) => {
            b.disabled = true;
            if (b.getAttribute('data-cat') === c.cat) b.classList.add('correct');
            else if (b === btn) b.classList.add('wrong');
          });
          document.getElementById('fb').innerHTML = `
            <div class="feedback ${ok ? 'good' : 'warn'}">
              <b>${ok ? 'Sauber!' : 'Nicht ganz – richtig ist: ' + label}</b>
              ${c.why}
              ${ok ? '' : '<div class="coach"><span class="avatar">🧑‍💼</span><span>Merke dir diese Zuordnung – sie taucht in der Klausur als Aussage-Wahr/Falsch-Aufgabe auf.</span></div>'}
            </div>`;
          ci++;
          setTimeout(drawRound, ok ? 750 : 1600);
        };
      });
    }
    startRound();
  }

  function orderGame(item, body, cb) {
    const pool = shuffle(item.items.slice());
    const seq = [];
    function draw() {
      body.innerHTML = `
        <p class="prompt">${item.prompt}</p>
        <div style="margin-bottom:12px">${item.items
          .map((_, i) => `<div class="order-slot ${seq[i] ? 'filled' : ''}">${seq[i] ? `${i + 1}. ${seq[i].text}` : `${i + 1}. …`}</div>`)
          .join('')}</div>
        <div class="order-pool">
          ${pool.filter((p) => !seq.includes(p)).map((p) => `<button class="order-item" data-id="${p.id}">${p.text}</button>`).join('')}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn sm ghost" id="reset"> Zurücksetzen</button>
          <button class="btn primary sm" id="check" ${seq.length === item.items.length ? '' : 'disabled'}>Prüfen</button>
        </div>
        <div id="fb"></div>`;
      body.querySelectorAll('.order-item').forEach((b) => (b.onclick = () => {
        seq.push(pool.find((p) => p.id === b.getAttribute('data-id')));
        draw();
      }));
      document.getElementById('reset').onclick = () => { seq.length = 0; draw(); };
      document.getElementById('check').onclick = () => {
        const ok = seq.every((s, i) => s.id === item.items[i].id);
        document.getElementById('fb').innerHTML = `
          <div class="feedback ${ok ? 'good' : 'bad'}">
            <b>${ok ? 'Perfekt – die Reihenfolge sitzt!' : 'Noch nicht die richtige Reihenfolge'}</b>
            ${item.solution}
          </div>
          <div class="row" style="margin-top:12px"><button class="btn primary sm" id="cont">Weiter →</button></div>`;
        document.getElementById('cont').onclick = () => cb(ok ? 1 : 0);
      };
    }
    draw();
  }

  function quizGame(item, body, cb) {
    let qi = 0, wrong = 0;
    function draw() {
      if (qi >= item.questions.length) return cb(wrong === 0 ? 1 : 0.6);
      const q = item.questions[qi];
      window.__quizQ = q; // für automatisierte Tests
      body.innerHTML = `
        <div class="tiny muted" style="margin-bottom:8px">Frage ${qi + 1}/${item.questions.length}</div>
        <p class="prompt"><b>${q.q}</b></p>
        <div class="opt-list">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
        <div id="fb"></div>`;
      body.querySelectorAll('.opt').forEach((b) => {
        b.onclick = () => {
          const i = parseInt(b.getAttribute('data-i'), 10);
          const ok = i === q.a;
          if (!ok) wrong++;
          body.querySelectorAll('.opt').forEach((x) => {
            x.disabled = true;
            if (parseInt(x.getAttribute('data-i'), 10) === q.a) x.classList.add('correct');
            else if (x === b) x.classList.add('wrong');
          });
          document.getElementById('fb').innerHTML = `
            <div class="feedback ${ok ? 'good' : 'warn'}">
              <b>${ok ? 'Richtig' : 'Knapp daneben'}</b>${q.why}
            </div>
            <div class="row" style="margin-top:12px"><button class="btn primary sm" id="next">${qi + 1 === item.questions.length ? 'Weiter →' : 'Nächste Frage →'}</button></div>`;
          document.getElementById('next').onclick = () => { qi++; draw(); };
        };
      });
    }
    draw();
  }

  /* ============================================================
     STUFE 2 – RECHEN-LABOR
     ============================================================ */
  function checkField(f, raw) {
    if (f.type === 'choice') return { ok: raw === f.ans };
    const vals = parseNums(raw);
    if (!vals.length) return { ok: false, empty: true };
    const tol = f.tol != null ? f.tol : Math.max(0.02, Math.abs(f.ans) * 0.003);
    const ok = vals.some((v) => Math.abs(v - f.ans) <= tol);
    let trap = null;
    if (!ok && f.traps) {
      for (const t of f.traps) {
        const tt = t.tol != null ? t.tol : Math.max(0.02, Math.abs(t.v) * 0.003);
        if (vals.some((v) => Math.abs(v - t.v) <= tt)) { trap = t.msg; break; }
      }
    }
    return { ok, trap, value: vals[0] };
  }

  function fieldHTML(f, tid) {
    const id = tid + '_' + f.key;
    if (f.type === 'choice') {
      return `<div style="margin-bottom:12px">
        <div class="small" style="margin-bottom:6px">${f.label}</div>
        <select id="${id}" data-key="${f.key}">
          <option value="">– bitte wählen –</option>
          ${f.options.map((o) => `<option>${o}</option>`).join('')}
        </select>
      </div>`;
    }
    return `<div class="field-row">
      <label for="${id}">${f.label}${f.hint ? ` <span class="tiny muted">(${f.hint})</span>` : ''}</label>
      <div style="display:flex;align-items:center"><input type="text" inputmode="decimal" id="${id}" data-key="${f.key}" placeholder="…" autocomplete="off"><span class="unit">${f.unit || ''}</span></div>
    </div>`;
  }

  function runLab(world, mount, done) {
    const tasks = world.lab.tasks;
    const solved = new Set();
    const helped = new Set();
    let showAll = false;

    function taskCard(t) {
      const done1 = solved.has(t.id);
      return `<div class="card" id="task_${t.id}" style="${done1 ? 'border-color:rgba(52,211,153,.4)' : ''}">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="chip ${done1 ? 'mint' : ''}">${done1 ? '✓ gelöst' : 'Aufgabe'}</span>
          <button class="btn sm ghost" data-solution="${t.id}">Lösung zeigen</button>
        </div>
        <p class="prompt">${t.prompt}</p>
        ${t.given ? `<div class="given">${t.given}</div>` : ''}
        <div id="fields_${t.id}">${t.fields.map((f) => fieldHTML(f, t.id)).join('')}</div>
        <div class="row" style="margin-top:6px">
          <button class="btn primary sm" data-check="${t.id}">Prüfen</button>
        </div>
        <div id="fb_${t.id}"></div>
      </div>`;
    }

    function draw() {
      mount.innerHTML = `
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <span class="chip mint">${solved.size} / ${tasks.length} Aufgaben gelöst</span>
          <span class="tiny muted">Punkte: ${Math.round(10 * Math.max(0, solved.size - helped.size) / tasks.length)} / 10</span>
        </div>
        <div class="pbar" style="margin-bottom:16px"><i style="width:${(solved.size / tasks.length) * 100}%"></i></div>
        ${tasks.map(taskCard).join('')}
        <div class="row" style="margin-top:16px">
          <button class="btn" id="finishLab" ${solved.size === tasks.length ? '' : 'disabled'}>Stufe abschließen</button>
          <span class="tiny muted">${solved.size === tasks.length ? 'Alle Aufgaben bearbeitet.' : 'Löse alle Aufgaben, um abzuschließen (Lösung zeigen zählt als bearbeitet, gibt aber keine Punkte).'}</span>
        </div>
        <p class="tiny muted" style="margin-top:14px">Eingabe-Hinweis: Dezimaltrennzeichen ist das Komma (oder der Punkt) – Tausenderpunkte werden ebenfalls toleriert. Beträge ohne Einheit in der angegebenen Einheit eingeben.</p>`;

      mount.querySelectorAll('[data-check]').forEach((btn) => {
        btn.onclick = () => {
          const t = tasks.find((x) => x.id === btn.getAttribute('data-check'));
          let allOk = true;
          const coach = [];
          t.fields.forEach((f) => {
            const input = document.getElementById(t.id + '_' + f.key);
            const res = checkField(f, input.value);
            input.classList.remove('ok', 'bad');
            if (res.ok) input.classList.add('ok');
            else if (input.value) {
              input.classList.add('bad');
              allOk = false;
              coach.push(res.trap || `„${f.label}“ stimmt noch nicht. ${f.hint ? 'Tipp: ' + f.hint : 'Rechne den Schritt einzeln nach.'}`);
            } else allOk = false;
          });
          const fb = document.getElementById('fb_' + t.id);
          if (allOk) {
            solved.add(t.id);
            fb.innerHTML = `<div class="feedback good"><b>Alle Werte korrekt 🎯</b>${t.solution}</div>`;
            mount.querySelectorAll('[data-check="' + t.id + '"]').forEach((b) => (b.disabled = true));
          } else {
            fb.innerHTML = `<div class="feedback warn"><b>Fast – die Engine hat ${coach.length} Stelle(n) geprüft</b>
              ${coach.map((c) => `<div class="coach"><span class="avatar">🧑‍💼</span><span>${c}</span></div>`).join('')}</div>`;
          }
          // Zähler aktualisieren ohne Neuaufbau (Fokusverlust vermeiden)
          const chip = mount.querySelector('.chip.mint');
          if (chip) chip.textContent = `${solved.size} / ${tasks.length} Aufgaben gelöst`;
          const pbar = mount.querySelector('.pbar > i');
          if (pbar) pbar.style.width = (solved.size / tasks.length) * 100 + '%';
          const fin = document.getElementById('finishLab');
          if (fin) fin.disabled = solved.size !== tasks.length;
        };
      });

      mount.querySelectorAll('[data-solution]').forEach((btn) => {
        btn.onclick = () => {
          const t = tasks.find((x) => x.id === btn.getAttribute('data-solution'));
          helped.add(t.id);
          const fb = document.getElementById('fb_' + t.id);
          fb.innerHTML = `<div class="feedback bad"><b>Musterlösung</b>${t.solution}
            <div class="row" style="margin-top:10px"><button class="btn sm" id="adopt_${t.id}">Als bearbeitet markieren</button></div></div>`;
          document.getElementById('adopt_' + t.id).onclick = () => {
            solved.add(t.id);
            draw();
          };
        };
      });

      const fin = document.getElementById('finishLab');
      if (fin) fin.onclick = () => {
        const ratio = Math.max(0, solved.size - helped.size) / tasks.length;
        done(ratio);
      };
    }
    draw();
  }

  /* ============================================================
     STUFE 3 – ENDLOS-TRAINER
     ============================================================ */
  function runTrainer(world, mount, done) {
    const TARGET = 5;
    let streak = 0, fails = 0, current = null;

    function draw() {
      current = world.trainer.gen();
      window.__trainerTask = current; // für automatisierte Tests
      mount.innerHTML = `
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <span class="chip amber">🔥 Serie: ${streak} / ${TARGET}</span>
          <span class="tiny muted">Fehlversuche: ${fails}</span>
        </div>
        <div class="pbar" style="margin-bottom:16px"><i style="width:${(streak / TARGET) * 100}%"></i></div>
        <div class="card">
          <p class="prompt">${current.prompt}</p>
          ${current.given ? `<div class="given">${current.given}</div>` : ''}
          <div id="tr_fields">${current.fields.map((f) => fieldHTML(f, 'tr')).join('')}</div>
          <div class="row" style="margin-top:6px"><button class="btn primary sm" id="tr_check">Prüfen</button>
          <button class="btn sm ghost" id="tr_skip">Aufgabe tauschen</button></div>
          <div id="tr_fb"></div>
        </div>`;
      document.getElementById('tr_check').onclick = () => {
        let allOk = true;
        const coach = [];
        current.fields.forEach((f) => {
          const input = document.getElementById('tr_' + f.key);
          const res = checkField(f, input.value);
          input.classList.remove('ok', 'bad');
          if (res.ok) input.classList.add('ok');
          else { allOk = false; if (input.value) { input.classList.add('bad'); coach.push(res.trap || `„${f.label}“ ist nicht korrekt.`); } }
        });
        const fb = document.getElementById('tr_fb');
        if (allOk) {
          streak++;
          APP.SAVE.streak += 1;
          if (streak >= TARGET) {
            APP.persist();
            return done(Math.max(0.4, (TARGET - fails * 0.5) / TARGET));
          }
          fb.innerHTML = `<div class="feedback good"><b>Richtig! +1 Serie</b>${current.solution}</div>`;
          document.getElementById('tr_check').disabled = true;
          setTimeout(draw, 900);
        } else {
          fails++;
          fb.innerHTML = `<div class="feedback warn"><b>Noch nicht</b>
            ${coach.map((c) => `<div class="coach"><span class="avatar">🧑‍💼</span><span>${c}</span></div>`).join('')}
            <div style="margin-top:8px">${current.solution}</div></div>
            <div class="row" style="margin-top:10px"><button class="btn sm" id="tr_next">Neue Aufgabe →</button></div>`;
          document.getElementById('tr_next').onclick = draw;
        }
      };
      document.getElementById('tr_skip').onclick = draw;
    }
    draw();
  }
})();


/* ============================================================
   src/ui_sims.js – Interaktive Simulatoren (pro Welt)
   ============================================================ */
(function () {
  'use strict';
  const R = window.R;
  const SIMS = {};

  /* ---------- SVG-Helfer ---------- */
  function chart(opts) {
    const w = opts.w || 620, h = opts.h || 260, pad = { l: 52, r: 14, t: 14, b: 28 };
    const { xmin, xmax, ymin, ymax } = opts;
    const x = (v) => pad.l + ((v - xmin) / (xmax - xmin)) * (w - pad.l - pad.r);
    const y = (v) => h - pad.b - ((v - ymin) / (ymax - ymin)) * (h - pad.t - pad.b);
    let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">`;
    // grid
    for (let k = 0; k <= 4; k++) {
      const yy = ymin + ((ymax - ymin) * k) / 4;
      s += `<line x1="${pad.l}" y1="${y(yy)}" x2="${w - pad.r}" y2="${y(yy)}" stroke="#1e2b44" stroke-width="1"/>`;
      s += `<text x="${pad.l - 6}" y="${y(yy) + 3}" text-anchor="end">${opts.yfmt ? opts.yfmt(yy) : R(yy, 0)}</text>`;
    }
    for (let k = 0; k <= 4; k++) {
      const xx = xmin + ((xmax - xmin) * k) / 4;
      s += `<text x="${x(xx)}" y="${h - pad.b + 15}" text-anchor="middle">${opts.xfmt ? opts.xfmt(xx) : R(xx, 0)}</text>`;
    }
    if (ymin < 0 && ymax > 0) s += `<line x1="${pad.l}" y1="${y(0)}" x2="${w - pad.r}" y2="${y(0)}" stroke="#41597d" stroke-width="1.2"/>`;
    (opts.series || []).forEach((se) => {
      const pts = se.points.map((p) => `${x(p[0])},${y(p[1])}`).join(' ');
      s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2.2}" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      if (se.area) {
        const first = se.points[0], last = se.points[se.points.length - 1];
        s += `<polygon points="${x(first[0])},${y(0)} ${pts} ${x(last[0])},${y(0)}" fill="${se.color}" opacity="0.08"/>`;
      }
    });
    (opts.markers || []).forEach((m) => {
      s += `<line x1="${x(m.x)}" y1="${pad.t}" x2="${x(m.x)}" y2="${h - pad.b}" stroke="${m.color || '#8fa1bd'}" stroke-width="1" stroke-dasharray="3 3"/>`;
      s += `<circle cx="${x(m.x)}" cy="${y(m.y)}" r="4" fill="${m.color || '#8fa1bd'}"/>`;
      if (m.label) s += `<text x="${x(m.x) + 6}" y="${y(m.y) - 7}" fill="${m.color || '#c3d1e6'}">${m.label}</text>`;
    });
    s += '</svg>';
    return s;
  }

  function simShell(worldId, title, sub) {
    const w = APP.WORLDS.find((x) => x.id === worldId);
    return `<div class="row" style="margin-bottom:6px">
        <button class="btn sm ghost" data-nav="world:${worldId}">← ${w.title}</button>
        <span class="chip" style="color:${w.color};border-color:${w.color}55">Simulator</span>
      </div>
      <h1 style="margin-top:10px">🔬 ${title}</h1>
      <p class="muted small">${sub}</p>
      <div id="simbody" style="margin-top:14px"></div>`;
  }

  window.renderSim = function (worldId, root) {
    const sim = SIMS[worldId];
    root.innerHTML = simShell(worldId, sim.title, sim.sub);
    sim.run(document.getElementById('simbody'));
  };

  /* ============================================================
     W1 – Zeitstrahl-Diskontierer
     ============================================================ */
  SIMS.W1 = {
    title: 'Zeitstrahl-Diskontierer',
    sub: 'Ziehe den Zinsregler und beobachte, wie aus einer Zahlungsreihe ein Barwert wird.',
    run: function (mount) {
      const flows = [-27000, 10000, 8000, 6000, 15000];
      let i = 0.04;
      function draw() {
        const pv = flows.map((f, t) => f * FIN.df(i, t));

        mount.innerHTML = `
        <div class="card">
          <div class="slider-row">
            <div class="s-label"><span>Kalkulationszins i</span><span class="s-value">${R(i * 100, 1)} %</span></div>
            <input type="range" id="i" min="0" max="15" step="0.1" value="${i * 100}">
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>t</th>${flows.map((_, t) => `<th>t=${t}</th>`).join('')}<th>Summe</th></tr></thead>
            <tbody>
              <tr><td>Zahlung</td>${flows.map((f) => `<td>${R(f, 0)} €</td>`).join('')}<td>—</td></tr>
              <tr class="hl"><td>Barwert</td>${pv.map((v) => `<td>${R(v, 2)} €</td>`).join('')}<td><b>${R(pv.reduce((a, b) => a + b, 0), 2)} €</b></td></tr>
              <tr><td>Gewicht</td>${bar.map((b) => `<td>${Math.round(b * 100)} %</td>`).join('')}<td></td></tr>

            <div style="flex:1;min-width:200px"><div class="s-label"><span>Fremdkapitalzins r_f</span><span class="s-value">${R(rf, 1)} %</span></div>
              <input type="range" id="rf" min="0" max="15" step="0.5" value="${rf}"></div>
          </div>
          ${chart({ xmin: 0, xmax: 0.9, ymin: Math.min(-10, Math.min.apply(null, curve.map((p) => p[1]))), ymax: Math.max(30, Math.max.apply(null, curve.map((p) => p[1])) + 5),
            xfmt: (v) => R(v * 100, 0) + ' %', yfmt: (v) => R(v, 0) + ' %',
            series: [{ points: curve, color: lev.positive ? '#34d399' : '#f87171', width: 2.4 }],
            markers: [{ x: fkShare, y: lev.roePct, color: '#fbbf24', label: 'r_e = ' + R(lev.roePct, 2) + ' %' }] })}
          <div class="tiles" style="margin-top:12px">
            <div class="tile"><div class="t-label">EK</div><div class="t-value">${R(total * (1 - fkShare), 0)} €</div></div>
            <div class="tile"><div class="t-label">FK</div><div class="t-value">${R(total * fkShare, 0)} €</div></div>
            <div class="tile"><div class="t-label">FK-Zinsen</div><div class="t-value">${R(lev.interest, 0)} €</div></div>
            <div class="tile"><div class="t-label">Reingewinn</div><div class="t-value">${R(lev.netProfit, 0)} €</div></div>
            <div class="tile"><div class="t-label">EK-Rentabilität</div><div class="t-value" style="color:${lev.positive ? 'var(--mint)' : 'var(--red)'}">${R(lev.roePct, 2)} %</div></div>
          </div>
          <div class="feedback ${lev.positive ? 'good' : 'bad'}" style="margin-top:10px">
            <b>${lev.positive ? 'Positiver Leverage-Effekt' : 'Negativer Leverage-Effekt'}</b>
            ${lev.positive ? 'r_g > r_f: Jede zusätzliche Fremdkapital-Einheit hebt die Eigenkapitalrentabilität über die Gesamtkapitalrendite.' : 'r_g < r_f: Der Hebel wirkt gegen dich – die EK-Rentabilität sinkt unter die Gesamtkapitalrendite, die Bonität leidet.'}
          </div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <h3 style="margin:0">Tilgungs-Architekt · 10.000 €, 10 %, 3 Jahre</h3>
            <select id="plan" style="width:auto">
              <option value="ANNUITY" ${plan === 'ANNUITY' ? 'selected' : ''}>Annuitätendarlehen</option>
              <option value="REDEMPTION" ${plan === 'REDEMPTION' ? 'selected' : ''}>Abzahlungsdarlehen</option>
              <option value="FEST" ${plan === 'FEST' ? 'selected' : ''}>Festdarlehen</option>
            </select>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>Jahr</th><th>Restschuld Beginn</th><th>Zinsen</th><th>Tilgung</th><th>Rate</th></tr></thead>
            <tbody>${plans.rows.map((r) => `<tr><td>${r.t}</td><td>${R(r.restStart, 2)} €</td><td>${R(r.interest, 2)} €</td><td>${R(r.redemption, 2)} €</td><td><b>${R(r.rate, 2)} €</b></td></tr>`).join('')}
            <tr class="hl"><td>Σ</td><td>—</td><td>${R(plans.rows.reduce((a, r) => a + r.interest, 0), 2)} €</td><td>10.000,00 €</td><td><b>${R(plans.total, 2)} €</b></td></tr></tbody>
          </table></div>
          <div class="tiny muted" style="margin-top:8px">Annuität: konstante Rate, fallende Zinsen, steigende Tilgung. Abzahlung: konstante Tilgung, fallende Rate – deshalb die niedrigste Gesamtzahlung. Festdarlehen: geringe Belastung während der Laufzeit, dafür Endtilgung und die höchste Gesamtzahlung.</div>
        </div>`;
        const b = (id, fn) => (document.getElementById(id).oninput = (e) => { fn(parseFloat(e.target.value)); draw(); });
        b('fk', (v) => (fkShare = v / 100));
        b('rg', (v) => (rg = v));
        b('rf', (v) => (rf = v));
        document.getElementById('plan').onchange = (e) => { plan = e.target.value; draw(); };
      }
      draw();
    }
  };


  /* ============================================================
     W9 – Aktien-Bewertungsterminal (Kapitel 5)
     ============================================================ */
  SIMS.W9 = {
    title: 'Aktien-Bewertungsterminal',
    sub: 'Vom CAPM-Zins zum fairen Wert: Gordon-Growth in Echtzeit, mit Marktpreis-Abgleich.',
    run: function (mount) {
      let d1 = 3.0, g = 0.04, rf = 0.03, beta = 1.4, rm = 0.09, price = 60, eps = 2.875;
      function draw() {
        const r = FIN.capm(rf, beta, rm);
        const p0 = FIN.gordon(d1, r, g);
        const implied = p0 ? FIN.impliedGrowth(d1, r, price) : null;
        const curve = [];
        const rMin = Math.max(0.02, g + 0.005);
        for (let k = 0; k <= 160; k++) {
          const rr = rMin + (k / 160) * (0.25 - rMin);
          curve.push([rr, FIN.gordon(d1, rr, g)]);
        }
        const ymax = Math.min(Math.max.apply(null, curve.map((p) => p[1])) || 200, 300);
        const pts = curve.filter((p) => p[1] <= ymax);
        const fair = p0 != null && price < p0;
        mount.innerHTML = `
        <div class="card">
          <div class="row" style="gap:16px;flex-wrap:wrap">
            <div style="flex:1;min-width:170px"><div class="s-label"><span>Dividende D₁</span><span class="s-value">${R(d1, 2)} €</span></div>
              <input type="range" id="d1" min="0.5" max="8" step="0.1" value="${d1}"></div>
            <div style="flex:1;min-width:170px"><div class="s-label"><span>Wachstum g</span><span class="s-value">${R(g * 100, 1)} %</span></div>
              <input type="range" id="g" min="0" max="8" step="0.25" value="${g * 100}"></div>
            <div style="flex:1;min-width:170px"><div class="s-label"><span>Börsenkurs</span><span class="s-value">${R(price, 2)} €</span></div>
              <input type="range" id="px" min="10" max="150" step="1" value="${price}"></div>
          </div>
          <div class="row" style="gap:16px;flex-wrap:wrap;margin-top:12px">
            <div style="flex:1;min-width:150px"><div class="s-label"><span>r_f</span><span class="s-value">${R(rf * 100, 1)} %</span></div>
              <input type="range" id="rf" min="0" max="6" step="0.1" value="${rf * 100}"></div>
            <div style="flex:1;min-width:150px"><div class="s-label"><span>Beta β</span><span class="s-value">${R(beta, 1)}</span></div>
              <input type="range" id="beta" min="0.3" max="2.5" step="0.1" value="${beta}"></div>
            <div style="flex:1;min-width:150px"><div class="s-label"><span>Marktrendite r_m</span><span class="s-value">${R(rm * 100, 1)} %</span></div>
              <input type="range" id="rm" min="4" max="15" step="0.5" value="${rm * 100}"></div>
          </div>
          ${p0 ? chart({
            xmin: rMin, xmax: 0.25, ymin: 0, ymax: ymax,
            xfmt: (v) => R(v * 100, 0) + ' %', yfmt: (v) => R(v, 0) + ' €',
            series: [{ points: pts, color: '#c084fc', width: 2.4 }],
            markers: [
              { x: r, y: p0, color: '#34d399', label: 'P₀ = ' + R(p0, 2) + ' €' },
              { x: r, y: 0, color: '#8fa1bd' }
            ]
          }) : '<div class="feedback bad"><b>r ≤ g</b>Das Gordon-Modell ist hier nicht definiert – der Nenner (r − g) wird null oder negativ.</div>'}
          <div class="tiles" style="margin-top:12px">
            <div class="tile"><div class="t-label">CAPM-Zins r</div><div class="t-value" style="color:#38bdf8">${R(r * 100, 2)} %</div></div>
            <div class="tile"><div class="t-label">Fairer Wert</div><div class="t-value" style="color:#c084fc">${p0 ? R(p0, 2) + ' €' : '–'}</div></div>
            <div class="tile"><div class="t-label">Implizites g im Kurs</div><div class="t-value">${implied != null ? R(implied * 100, 2) + ' %' : '–'}</div></div>
            <div class="tile"><div class="t-label">KGV bei EPS ${R(eps, 2)} €</div><div class="t-value">${p0 ? R(p0 / eps, 1) + ' ×' : '–'}</div></div>
          </div>
          <div class="given" style="margin-top:12px">r = ${R(rf * 100, 1)} % + ${R(beta, 1)} · (${R(rm * 100, 1)} % − ${R(rf * 100, 1)} %) = ${R(r * 100, 2)} % · P₀ = ${R(d1, 2)} / (${R(r * 100, 2)} % − ${R(g * 100, 1)} %) = ${p0 ? R(p0, 2) : '–'} €</div>
          <div class="feedback ${fair ? 'good' : 'warn'}" style="margin-top:10px">
            <b>${fair ? 'Rechnerisch unterbewertet' : 'Rechnerisch überbewertet oder fair bewertet'}</b>
            Modellwert ${p0 ? R(p0, 2) : '–'} € vs. Marktpreis ${R(price, 2)} €.
            <div class="tiny muted" style="margin-top:4px">Vorsicht: Das Modell hängt extrem an g. Schon 2 Prozentpunkte mehr Wachstum verdoppeln den Wert oft – deshalb ist die Sensitivitätsanalyse (Kurve oben) in der Klausur der eigentliche Prüfstein.</div>
          </div>
        </div>`;
        const b = (id, fn) => (document.getElementById(id).oninput = (e) => { fn(parseFloat(e.target.value)); draw(); });
        b('d1', (v) => (d1 = v));
        b('g', (v) => (g = v / 100));
        b('px', (v) => (price = v));
        b('rf', (v) => (rf = v / 100));
        b('beta', (v) => (beta = v));
        b('rm', (v) => (rm = v / 100));
      }
      draw();
    }
  };

  window.SIMULATORS = SIMS;
})();


/* ============================================================
   src/app.js – Probeklausur (Bosskampf) & Init
   ============================================================ */
(function () {
  'use strict';
  const R = window.R;
  const parseNum = (s) => {
    if (s == null) return NaN;
    const raw = String(s).trim().replace(/[€%\s]/g, '');
    if (!raw) return NaN;
    const cands = [];
    if (raw.includes(',')) {
      cands.push(parseFloat(raw.replace(/\./g, '').replace(',', '.')));
      cands.push(parseFloat(raw.replace(/,/g, '')));
    } else {
      cands.push(parseFloat(raw));
      cands.push(parseFloat(raw.replace(/\./g, '')));
    }
    return cands.filter((x) => !isNaN(x));
  };

  function shuffle(a) {
    return a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((x) => x[1]);
  }

  /* ---------- Klausur zusammenbauen ---------- */
  function buildExam() {
    const sides = {
      INV: APP.WORLDS.filter((w) => w.side === 'INV').map((w) => w.id),
      FIN: APP.WORLDS.filter((w) => w.side === 'FIN').map((w) => w.id)
    };
    const out = [];
    Object.keys(sides).forEach((side) => {
      const pool = [];
      sides[side].forEach((id) => {
        const w = APP.WORLDS.find((x) => x.id === id);
        // MC-Fragen aus den Konzeptspielen
        w.concept.items.forEach((it) => {
          if (it.kind === 'quiz') {
            it.questions.forEach((q) => pool.push({
              side: side, world: id, kind: 'mc',
              text: q.q, options: q.options, a: q.a, why: q.why
            }));
          }
        });
        // generierte Rechenaufgabe
        try {
          const g = w.trainer.gen();
          const f = g.fields[0];
          pool.push({
            side: side, world: id, kind: 'num',
            text: g.prompt + (g.given ? `<div class="given" style="margin-top:8px">${g.given}</div>` : ''),
            label: f.label, ans: f.ans, unit: f.unit, tol: f.tol, type: f.type, options: f.options,
            why: 'Richtig sind hier ' + (f.type === 'choice' ? f.ans : R(f.ans) + ' ' + (f.unit || '')) + '.'
          });
        } catch (e) {}
      });
      const picked = shuffle(pool).slice(0, 10);
      picked.forEach((p) => out.push(p));
    });
    return shuffle(out).sort((a, b) => (a.side === b.side ? 0 : a.side === 'INV' ? -1 : 1));
  }

  /* ---------- Prüfungs-View ---------- */
  window.renderExam = function (root) {
    const items = buildExam();
    const perItem = 120 / items.length; // = 6
    let remaining = 120 * 60;
    let submitted = false;

    root.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <button class="btn sm ghost" data-nav="home">← Cockpit</button>
        <span class="chip amber">Investition 60 P. · Finanzierung 60 P.</span>
      </div>
      <div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:10px">
        <div>
          <h1 style="margin:0">🎯 Probeklausur · Investition &amp; Finanzierung 1</h1>
          <p class="muted small" style="margin:6px 0 0">${items.length} Aufgaben · je ${perItem} Punkte · Gesamtpunktzahl 120</p>
        </div>
        <div style="text-align:right">
          <div class="exam-timer" id="timer">02:00:00</div>
          <div class="tiny muted">Restzeit</div>
        </div>
      </div>
      <div class="pbar" style="margin:14px 0 18px"><i id="epbar" style="width:0%"></i></div>
      <div id="examitems">
        ${items.map((it, i) => `
          <div class="card" style="margin-bottom:12px" id="ex_${i}">
            <div class="row" style="justify-content:space-between;margin-bottom:8px">
              <span class="chip">Aufgabe ${i + 1} · ${it.side === 'INV' ? 'Investition' : 'Finanzierung'}</span>
              <span class="tiny muted">${perItem} Punkte</span>
            </div>
            <p class="prompt">${it.text}</p>
            ${it.kind === 'mc'
              ? `<div class="opt-list">${it.options.map((o, k) => `<button class="opt" data-q="${i}" data-o="${k}">${o}</button>`).join('')}</div>`
              : `<div class="field-row"><label>${it.label}</label><div style="display:flex;align-items:center">
                  ${it.type === 'choice'
                    ? `<select data-q="${i}" data-key="v">${['', ...it.options].map((o) => `<option>${o}</option>`).join('')}</select>`
                    : `<input type="text" inputmode="decimal" data-q="${i}" data-key="v" autocomplete="off"><span class="unit">${it.unit || ''}</span>`}
                </div></div>`}
          </div>`).join('')}
      </div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn primary" id="submitExam">Prüfung abgeben</button>
      </div>`;

    const answers = {};
    root.querySelectorAll('[data-o]').forEach((b) => {
      b.onclick = () => {
        const qi = b.getAttribute('data-q');
        answers[qi] = parseInt(b.getAttribute('data-o'), 10);
        root.querySelectorAll(`[data-o="${qi}"]`).forEach((x) => x.classList.remove('correct'));
        b.classList.add('correct');
        updateBar();
      };
    });
    root.querySelectorAll('[data-key="v"]').forEach((inp) => {
      inp.oninput = () => { answers[inp.getAttribute('data-q')] = inp.value; updateBar(); };
      inp.onchange = inp.oninput;
    });
    function updateBar() {
      const answered = Object.keys(answers).filter((k) => answers[k] !== '' && answers[k] != null).length;
      const bar = document.getElementById('epbar');
      if (bar) bar.style.width = (answered / items.length) * 100 + '%';
    }

    const timerEl = document.getElementById('timer');
    const tick = setInterval(() => {
      if (submitted) return clearInterval(tick);
      remaining--;
      const hh = String(Math.floor(remaining / 3600)).padStart(2, '0');
      const mm = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
      const ss = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = `${hh}:${mm}:${ss}`;
      if (remaining < 600) timerEl.classList.add('low');
      if (remaining <= 0) { clearInterval(tick); grade(); }
    }, 1000);

    function grade() {
      submitted = true;
      clearInterval(tick);
      let inv = 0, fin = 0;
      const weak = {};
      items.forEach((it, i) => {
        const card = document.getElementById('ex_' + i);
        let ok = false;
        if (it.kind === 'mc') {
          const chosen = answers[i];
          ok = chosen === it.a;
          card.querySelectorAll('.opt').forEach((b) => {
            const k = parseInt(b.getAttribute('data-o'), 10);
            b.disabled = true;
            if (k === it.a) b.classList.add('correct');
            else if (k === chosen) b.classList.add('wrong');
          });
        } else {
          const raw = answers[i];
          const input = card.querySelector('[data-key="v"]');
          let ok2 = false;
          if (it.type === 'choice') ok2 = raw === it.ans;
          else {
            const nums = parseNum(raw);
            const tol = it.tol != null ? it.tol : Math.max(0.02, Math.abs(it.ans) * 0.003);
            ok2 = nums.some((x) => Math.abs(x - it.ans) <= tol);
          }
          ok = ok2;
          if (input) {
            input.classList.add(ok ? 'ok' : 'bad');
            input.disabled = true;
          }
        }
        if (ok) { if (it.side === 'INV') inv += perItem; else fin += perItem; }
        else weak[it.world] = (weak[it.world] || 0) + 1;
        const fb = document.createElement('div');
        fb.className = 'feedback ' + (ok ? 'good' : 'warn');
        fb.innerHTML = `<b>${ok ? '+' + perItem + ' Punkte' : '0 Punkte'}</b>${it.why}`;
        card.appendChild(fb);
      });

      const total = inv + fin;
      APP.SAVE.exam.taken += 1;
      APP.SAVE.exam.best = Math.max(APP.SAVE.exam.best, total);
      APP.SAVE.exam.lastSplit = [inv, fin];
      APP.persist();

      const note = total >= 96 ? 'Klausurniveau sicher erreicht – jetzt Tempo und Formulierung trainieren.'
        : total >= 72 ? 'Solide Basis. Arbeite die schwächsten Welten gezielt nach.'
        : total >= 48 ? 'Grundlagen sitzen teilweise – wiederhole die Rechen-Labore der markierten Welten.'
        : 'Starte die Kampagne erneut: Konzeptstufe, dann Labor, dann Endlos-Trainer.';

      const weakList = Object.keys(weak).map((id) => {
        const w = APP.WORLDS.find((x) => x.id === id);
        return `<li>Welt ${w.no} · ${w.title} – ${weak[id]} Aufgabe(n) falsch</li>`;
      }).join('') || '<li>Keine Schwachstellen erkannt.</li>';

      const checklist = `CFO-Simulator · Auswertung Probeklausur
Datum: ${new Date().toLocaleDateString('de-DE')}
Gesamt: ${total} / 120 Punkte
Investition: ${inv} / 60
Finanzierung: ${fin} / 60
Bewertung: ${note}

Schwachstellen:
${Object.keys(weak).map((id) => { const w = APP.WORLDS.find((x) => x.id === id); return `- Welt ${w.no} ${w.title}: ${weak[id]} Aufgabe(n) falsch`; }).join('\n') || '- keine'}

Empfehlung: Stufe 1 (Konzept) → Stufe 2 (Rechen-Labor) → Stufe 3 (Endlos-Trainer) der markierten Welten.`;

      root.innerHTML = `
        <div class="card center" style="padding:30px">
          <div style="font-size:40px">${total >= 96 ? '🏆' : total >= 72 ? '🎉' : total >= 48 ? '📈' : '📚'}</div>
          <h1 style="margin:8px 0 4px">${total} / 120 Punkte</h1>
          <p class="muted">${note}</p>
          <div class="tiles" style="margin:18px 0">
            <div class="tile"><div class="t-label">Investition</div><div class="t-value" style="color:var(--sky)">${inv} / 60</div></div>
            <div class="tile"><div class="t-label">Finanzierung</div><div class="t-value" style="color:var(--pink)">${fin} / 60</div></div>
          </div>
          <div style="text-align:left;max-width:560px;margin:0 auto">
            <h3>Schwachstellen-Analyse</h3>
            <ul class="small muted" style="padding-left:18px">${weakList}</ul>
          </div>
          <div class="row" style="justify-content:center;margin-top:16px">
            <button class="btn" data-nav="home">Zurück ins Cockpit</button>
            <button class="btn primary" data-nav="exam">Neuer Versuch</button>
          </div>
          <details style="margin-top:18px;text-align:left">
            <summary class="small muted" style="cursor:pointer">Checkliste als Text anzeigen (kopieren)</summary>
            <pre class="small" style="white-space:pre-wrap;background:#0a1220;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px">${checklist}</pre>
          </details>
        </div>`;
    }

    document.getElementById('submitExam').onclick = () => {
      const open = items.length - Object.keys(answers).filter((k) => answers[k] !== '' && answers[k] != null).length;
      if (open > 0 && !confirm(`${open} Aufgabe(n) sind noch leer. Trotzdem abgeben?`)) return;
      grade();
    };
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  /* ---------- Start ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && APP.view.name !== 'home') APP.go({ name: 'home' });
  });
  APP.render();
})();

</script>
